<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Konyha – Zolgiz Ételbár</title>
  <meta name="theme-color" content="#14110f">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2314110f'/%3E%3Ctext x='32' y='45' font-family='Arial Black,Arial' font-weight='900' font-size='38' text-anchor='middle' fill='%23ffc629'%3EZ%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/kitchen.css">
</head>
<body>
  <!-- BELÉPÉS -->
  <main class="login" id="login" hidden>
    <form class="login__box" id="login-form" novalidate>
      <span class="login__mark" aria-hidden="true">Z</span>
      <h1>Konyhai felület</h1>
      <p class="login__lead">Csak a Zolgiz Ételbár személyzetének.</p>
      <p class="login__demo" id="login-demo" hidden></p>
      <label class="kf" id="email-field">
        <span>Email</span>
        <input type="email" name="email" autocomplete="username" required>
      </label>
      <label class="kf">
        <span>Jelszó</span>
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <p class="login__err" id="login-err" role="alert"></p>
      <button class="kbtn kbtn--go kbtn--block" type="submit" id="login-btn">Belépés</button>
    </form>
  </main>

  <!-- ALKALMAZÁS -->
  <div class="app" id="app" hidden>
    <header class="bar">
      <div class="bar__brand"><span class="login__mark login__mark--sm" aria-hidden="true">Z</span><b>Konyha</b></div>
      <nav class="tabs" role="tablist" aria-label="Nézetek">
        <button role="tab" aria-selected="true" data-tab="board" id="tab-board">Pult <span class="tabs__n" data-count-active>0</span></button>
        <button role="tab" aria-selected="false" data-tab="menu" id="tab-menu">Étlap</button>
        <button role="tab" aria-selected="false" data-tab="day" id="tab-day">Mai nap</button>
      </nav>
      <div class="bar__tools">
        <button class="ktoggle" type="button" id="open-toggle" aria-pressed="true"><span class="ktoggle__dot"></span><span data-open-label>Rendelésfogadás: NYITVA</span></button>
        <label class="kselect">
          <span>Plusz várakozás</span>
          <select id="extra-wait">
            <option value="0">nincs</option><option value="10">+10 perc</option><option value="20">+20 perc</option><option value="30">+30 perc</option><option value="45">+45 perc</option>
          </select>
        </label>
        <button class="kicon" type="button" id="sound-btn" aria-pressed="false" aria-label="Hang"><svg class="i" aria-hidden="true"><use href="#i-mute"/></svg></button>
        <button class="kbtn kbtn--ghost" type="button" id="demo-order" hidden>+ Teszt rendelés</button>
        <time class="bar__clock" id="clock"></time>
        <button class="kicon" type="button" id="logout" aria-label="Kijelentkezés"><svg class="i" aria-hidden="true"><use href="#i-logout"/></svg></button>
      </div>
    </header>

    <div class="soundwarn" id="soundwarn" hidden>
      <svg class="i" aria-hidden="true"><use href="#i-volume"/></svg>
      <span>A hang ki van kapcsolva – így nem hallod az új rendeléseket.</span>
      <button class="kbtn kbtn--go" type="button" data-sound-on>Hang bekapcsolása</button>
    </div>
    <div class="errbar" id="errbar" role="alert" hidden></div>

    <main>
      <section class="board" id="panel-board" role="tabpanel" aria-labelledby="tab-board">
        <div class="col" data-col="NEW"><h2>Új <span data-n></span></h2><div class="col__list" aria-live="polite"></div></div>
        <div class="col" data-col="COOKING"><h2>Készül <span data-n></span></h2><div class="col__list"></div></div>
        <div class="col" data-col="READY"><h2>Kész <span data-n></span></h2><div class="col__list"></div></div>
        <div class="col" data-col="ON_THE_WAY"><h2>Úton <span data-n></span></h2><div class="col__list"></div></div>
      </section>
      <section class="pane" id="panel-menu" role="tabpanel" aria-labelledby="tab-menu" hidden></section>
      <section class="pane" id="panel-day" role="tabpanel" aria-labelledby="tab-day" hidden></section>
    </main>
  </div>

  <script type="module" src="js/kitchen.js"></script>
</body>
</html>
